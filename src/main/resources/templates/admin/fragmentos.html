<!-- Fragmento #1: head del panel del administrador -->
<head th:fragment="head">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Hotel - Administrador</title>
    <link th:href="@{/webjars/bootstrap/css/bootstrap.min.css}" rel="stylesheet"/>
    <link th:href="@{/webjars/font-awesome/css/all.css}" rel="stylesheet"/>
    <script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
    <style>
        body { background-color: #f8f8f3; }
        .barra-admin { background-color: #123b16; }
        .encabezado-seccion { background-color: #174b22; }
        .texto-hotel { color: #174b22; }
        .tarjeta-resumen { border: none; border-radius: 12px; }
    </style>
</head>

<!-- Fragmento #2: menu del administrador -->
<header th:fragment="encabezado">
    <nav class="navbar navbar-expand-md navbar-dark barra-admin">
        <div class="container">
            <a class="navbar-brand" th:href="@{/admin/dashboard}">
                <i class="fa-solid fa-hotel"></i> [[#{admin.titulo}]]
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuAdmin">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-between" id="menuAdmin">
                <ul class="navbar-nav">
                    <li class="nav-item px-2">
                        <a class="nav-link" th:href="@{/admin/dashboard}">
                            <i class="fa-solid fa-gauge"></i> [[#{admin.panel}]]
                        </a>
                    </li>
                    <li class="nav-item px-2">
                        <a class="nav-link" th:href="@{/habitacion/inicio}">
                            <i class="fa-solid fa-bed"></i> [[#{admin.habitaciones}]]
                        </a>
                    </li>
                    <li class="nav-item px-2">
                        <a class="nav-link" th:href="@{/tipoHabitacion/listado(idEmpresa=${empresa.idEmpresa})}">
                            <i class="fa-solid fa-layer-group"></i> [[#{admin.tiposHabitacion}]]
                        </a>
                    </li>
                    <li class="nav-item px-2">
                        <a class="nav-link" th:href="@{/}">
                            <i class="fa-solid fa-house"></i> [[#{admin.inicio}]]
                        </a>
                    </li>
                </ul>
                <!-- El cierre de sesión de Spring Security debe enviarse por POST -->
                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="btn btn-outline-light btn-sm">
                        <i class="fa-solid fa-right-from-bracket"></i> [[#{admin.salir}]]
                    </button>
                </form>
            </div>
        </div>
    </nav>
</header>

<!-- Fragmento #3: pie de pagina -->
<footer th:fragment="pie" class="p-3 mt-4 barra-admin text-white text-center">
    [[#{admin.derechos}]] &copy;
</footer>
