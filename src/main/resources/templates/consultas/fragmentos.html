<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
    <head th:replace="~{general/plantilla :: head}"/>

    <body>
        <!-- fragmento 1 para el listado de tarjetas de habitaciones libres (foto, precio y capacidad) -->
        <section th:fragment="tarjetas" class="container py-4">
            <div class="text-center p-2" th:if="${empresaBuscada != null}">
                <h4>[[${empresaBuscada.nombre}]]</h4>
            </div>
            <div class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 row-cols-xl-4 g-4">
                <div th:each="h : ${habitaciones}" class="col">
                    <div class="card h-100 shadow-sm">
                        <div class="d-flex justify-content-center align-items-center bg-light p-3" style="height: 200px;">
                            <img th:src="${h.rutaImagen}" class="img-fluid" 
                                 th:alt="${h.tipoHabitacion.nombre}" 
                                 style="max-height: 100%; object-fit: contain;"/>
                        </div>
                        <div class="card-header bg-white">
                            <h5 class="card-title text-center text-truncate mb-0" th:text="${h.tipoHabitacion.nombre}">Título</h5>
                        </div>
                        <div class="card-body d-flex flex-column">
                            <p class="card-text text-muted mb-auto text-truncate" th:text="${h.numero}">Número</p>
                        </div>
                        <div class="card-footer bg-white d-flex justify-content-between align-items-center">
                            <div class="fw-bold">
                                <span class="text-success h5" th:text="${#numbers.formatCurrency(h.tipoHabitacion.precioNoche)}">$99.99</span>
                                <span class="badge text-bg-success ms-2" th:text="${h.tipoHabitacion.capacidad} + ' personas'"></span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="text-center p-2" th:if="${habitaciones != null and habitaciones.empty}">
                <span>[[#{lista.vacia}]]</span>
            </div>
        </section>

        <section th:fragment='consultas' class='row row-cols-4 p-2'>
            <div th:replace="~{consultas/fragmentos :: formLibres('primary',#{consultas.libres},'/consultas/consultaLibres')}"/>
        </section>

        <div th:fragment='formLibres(colorForm, textoForm, urlForm)'>
            <form method="post" th:action='@{${urlForm}}' class='was-validated'>
                <div class='card p-2'>
                    <div class="card-header text-center text-white" th:classappend="${'bg-'+colorForm}">
                        <h5>[[${textoForm}]]</h5>
                    </div>
                    <div class="card-body">
                        <div class='mb-3'>
                            <label>[[#{buscar.hotel}]]</label>
                            <select name='idEmpresa' class='form-select' required>
                                <option th:each="e : ${empresas}" th:value="${e.idEmpresa}">
                                    [[${e.nombre}]]
                                </option>
                            </select>
                        </div>
                        <div class='mb-3'>
                            <label>[[#{buscar.fechaEntrada}]]</label>
                            <input type="date" name='fechaEntrada' th:value='${fechaEntrada}'
                                   class='form-control' required/>
                        </div>
                        <div class='mb-3'>
                            <label>[[#{buscar.fechaSalida}]]</label>
                            <input type="date" name='fechaSalida' th:value='${fechaSalida}'
                                   class='form-control' required/>
                        </div>
                        <div class='mb-3'>
                            <label>[[#{buscar.personas}]]</label>
                            <input type="number" name='personas' th:value='${personas}'
                                   class='form-control' min="1" required/>
                        </div>
                    </div>
                    <div class="card-footer text-center">
                        <button type='submit' class='btn text-white' th:classappend="${'btn-'+colorForm}">
                            <i class='fa-solid fa-magnifying-glass'></i> [[${textoForm}]]
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </body>
</html>
