<!-- 1 Fragmento con formulario unificado para agregar y modificar habitacion -->
<section th:fragment="formulario">
    <div class="row py-4 mb-2 bg-light">
        <div class="col-md-1"></div>
        <div class="col-md-3">
            <button type="button"
                    class="btn btn-primary"
                    sec:authorize="hasRole('ROLE_ADMIN')"
                    data-bs-toggle="modal"
                    data-bs-target="#habitacionModal"
                    data-modo="agregar"
                    th:data-titulo="#{habitacion.agregar}">
                <i class="fa-solid fa-plus"></i>
                [[#{habitacion.agregar}]]
            </button>
        </div>
    </div>
    <div class="modal fade" id="habitacionModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <form id="habitacionForm"
                      method="post"
                      th:action="@{/habitacion/guardar}">
                    <div class="modal-header"
                         id="habitacionModalHeader">
                        <h5 class="modal-title" id="habitacionModalTitulo"></h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                    </div>
                    <div class="modal-body">
                        <input type="hidden" id="habitacionId" name="idHabitacion"/>
                        <input type="hidden" id="habitacionIdEmpresa" name="empresa.idEmpresa" th:value="${idEmpresa}"/>
                        <div class="mb-3">
                            <label for="habitacionIdTipoHabitacion">[[#{habitacion.tipo}]]</label>
                            <select id="habitacionIdTipoHabitacion" name="tipoHabitacion.idTipoHabitacion" class="form-select" required>
                                <option th:each="t : ${tiposHabitacion}" th:value="${t.idTipoHabitacion}">
                                    [[${t.nombre}]]
                                </option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="habitacionNumero">[[#{habitacion.numero}]]</label>
                            <input type="number" id="habitacionNumero" name="numero" min="1" step="1" class="form-control" required/>
                        </div>
                        <div class="mb-3">
                            <label for="habitacionEstado">[[#{habitacion.estado}]]</label>
                            <select id="habitacionEstado" name="estado" class="form-select" required>
                                <option value="DISPONIBLE">[[#{habitacion.estado.disponible}]]</option>
                                <option value="OCUPADA">[[#{habitacion.estado.ocupada}]]</option>
                                <option value="MANTENIMIENTO">[[#{habitacion.estado.mantenimiento}]]</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="habitacionRutaImagen">[[#{habitacion.imagen}]]</label>
                            <input type="text" id="habitacionRutaImagen" name="rutaImagen" maxlength="1024" class="form-control"/>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                            <i class="fa-solid fa-xmark"></i> [[#{accion.cerrar}]]
                        </button>
                        <button type="submit" class="btn btn-success">
                            <i class="fa-solid fa-floppy-disk"></i> [[#{accion.guardar}]]
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</section>

<!-- fragmento 2 para el listado de habitaciones -->
<section th:fragment="listado" class="p-3">
    <div class="row p-3">
        <div class="col-md-9">
            <div class="card p-2">
                <div class="card-header"><h4>[[#{habitacion.listado}]]</h4></div>
                <div class="card-body">
                    <div th:if="${habitaciones != null and !habitaciones.empty}">
                        <table class="table table-striped table-hover">
                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th>[[#{habitacion.numero}]]</th>
                                    <th>[[#{habitacion.tipo}]]</th>
                                    <th>[[#{habitacion.estado}]]</th>
                                    <th>[[#{habitacion.imagen}]]</th>
                                    <th></th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="h : ${habitaciones}">
                                    <td>[[${h.idHabitacion}]]</td>
                                    <td class="text-center">[[${h.numero}]]</td>
                                    <td th:text="${h.tipoHabitacion != null ? h.tipoHabitacion.nombre : ''}"></td>
                                    <td>[[${h.estado}]]</td>
                                    <td><img th:if="${h.rutaImagen != null}"
                                             th:src="${h.rutaImagen}"
                                             alt="Imagen de habitacion"
                                             height="75"/></td>
                                    <td sec:authorize="hasRole('ROLE_ADMIN')">
                                        <button type="button" class="btn btn-danger"
                                                data-bs-toggle="modal" data-bs-target="#confirmModal"
                                                th:data-bs-id="${h.idHabitacion}"
                                                th:data-bs-descripcion="${h.numero}">
                                            <i class="fa-solid fa-trash"></i> [[#{accion.eliminar}]]
                                        </button>                                           
                                        <button type="button"
                                                class="btn btn-warning"
                                                data-bs-toggle="modal"
                                                data-bs-target="#habitacionModal"
                                                data-modo="editar"
                                                th:data-titulo="#{accion.actualizar}"
                                                th:data-id="${h.idHabitacion}"
                                                th:data-tipo-habitacion-id="${h.tipoHabitacion != null ? h.tipoHabitacion.idTipoHabitacion : ''}"
                                                th:data-numero="${h.numero}"
                                                th:data-estado="${h.estado}"
                                                th:data-imagen="${h.rutaImagen != null ? h.rutaImagen : ''}">
                                            <i class="fas fa-pencil-alt"></i> [[#{accion.actualizar}]]
                                        </button>
                                    </td>
                                </tr>
                            </tbody>
                        </table></div>
                    <div class="text-center p-2" th:if="${habitaciones == null or habitaciones.empty}">
                        <span>[[#{lista.vacia}]]</span></div>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card text-center bg-success text-white mb-3">
                <div class="card-body"><h3>[[#{habitacion.total}]]</h3>
                    <h4 class="fs-2"><i class="fas fa-layer-group"></i> [[${totalHabitaciones}]]</h4>
                </div></div>
        </div>
    </div>
</section>
